<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="pp-title pp-description">
  <title id="pp-title">Pipeline Parallelism — Split Model Layers Across GPUs</title>
  <desc id="pp-description">Three successive model stages run on different GPUs: layer 1 on GPU 1, layer 2 on GPU 2, and layer 3 on GPU 3. Each microbatch passes through all three stages in order. Below, a simplified forward-pass timeline shows microbatches A, B, and C from one batch. GPU 1 processes A, B, C in time slots 1, 2, 3; GPU 2 processes them in slots 2, 3, 4; GPU 3 processes them in slots 3, 4, 5. In slot 3 all GPUs work concurrently on different microbatches. Empty time slots show idle periods while the pipeline fills or drains. Colors identify GPUs consistently. Stage times are illustrative and equal; backward computation and communication time are omitted. A stage can contain multiple layers.</desc>
  <metadata>Reference: https://docs.pytorch.org/tutorials/intermediate/pipelining_tutorial.html</metadata>
  <defs>
    <marker id="pp-arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L6 4L1 7" fill="none" stroke="#657181" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="720" height="480" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#222a35" text-anchor="middle">
    <text x="360" y="31" font-size="25" font-weight="500">Split model layers across GPUs</text>
    <text x="360" y="63" font-size="20" fill="#596373">Each GPU holds a different stage</text>

    <rect x="32" y="95" width="176" height="112" rx="5" fill="#dceaf7"/>
    <rect x="272" y="95" width="176" height="112" rx="5" fill="#f6e7d6"/>
    <rect x="512" y="95" width="176" height="112" rx="5" fill="#e1eddd"/>
    <g font-size="22" font-weight="500">
      <text x="120" y="131">GPU 1</text>
      <text x="360" y="131">GPU 2</text>
      <text x="600" y="131">GPU 3</text>
    </g>
    <g font-size="25">
      <text x="120" y="178">Layer 1</text>
      <text x="360" y="178">Layer 2</text>
      <text x="600" y="178">Layer 3</text>
    </g>
    <g fill="none" stroke="#657181" stroke-width="1.5" marker-end="url(#pp-arrow)">
      <path d="M218 151H262"/>
      <path d="M458 151H502"/>
    </g>
    <text x="360" y="240" font-size="20" fill="#596373">Each microbatch passes through all stages</text>

    <text x="32" y="289" text-anchor="start" font-size="20">Forward pass</text>
    <text x="192" y="289" text-anchor="start" font-size="19" fill="#596373">Time</text>
    <path d="M250 282H666" fill="none" stroke="#657181" stroke-width="1.5" marker-end="url(#pp-arrow)"/>
    <g font-size="20" text-anchor="end">
      <text x="146" y="334">GPU 1</text>
      <text x="146" y="377">GPU 2</text>
      <text x="146" y="420">GPU 3</text>
    </g>
    <g fill="#dceaf7">
      <rect x="184" y="308" width="88" height="36" rx="3"/>
      <rect x="280" y="308" width="88" height="36" rx="3"/>
      <rect x="376" y="308" width="88" height="36" rx="3"/>
    </g>
    <g fill="#f6e7d6">
      <rect x="280" y="351" width="88" height="36" rx="3"/>
      <rect x="376" y="351" width="88" height="36" rx="3"/>
      <rect x="472" y="351" width="88" height="36" rx="3"/>
    </g>
    <g fill="#e1eddd">
      <rect x="376" y="394" width="88" height="36" rx="3"/>
      <rect x="472" y="394" width="88" height="36" rx="3"/>
      <rect x="568" y="394" width="88" height="36" rx="3"/>
    </g>
    <g font-size="21">
      <text x="228" y="334">A</text>
      <text x="324" y="334">B</text>
      <text x="420" y="334">C</text>
      <text x="324" y="377">A</text>
      <text x="420" y="377">B</text>
      <text x="516" y="377">C</text>
      <text x="420" y="420">A</text>
      <text x="516" y="420">B</text>
      <text x="612" y="420">C</text>
    </g>
    <text x="360" y="462" font-size="20" fill="#596373">A, B, C = microbatches from one batch</text>
  </g>
</svg>
